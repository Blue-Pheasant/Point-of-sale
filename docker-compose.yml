version: "3.7"

services:
  app:
    build: ./docker
    image: callmedavid/pos
    container_name: pos
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
    depends_on:
      - db
    environment:
      - DB_DSN=mysql:host=db;dbname=${MYSQL_DATABASE:-pos}
      - DB_USER=${MYSQL_USER:-pos}
      - DB_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-false}
    networks:
      - pos-network

  db:
    image: mysql:8
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-config.cnf:/etc/mysql/conf.d/config.cnf
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pos}
      MYSQL_USER: ${MYSQL_USER:-pos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    networks:
      - pos-network

volumes:
  mysql-data:

networks:
  pos-network:
    driver: bridge
